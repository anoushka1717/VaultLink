<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VaultLink shared file</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div class="brand">🔐 VaultLink</div><span>Recipient portal</span></header><main><section class="card"><h1>Secure file access</h1><div id="info">Checking share link…</div><form id="verify"><label>Passcode<input name="passcode" type="password" minlength="4" required></label><button>Verify & download</button></form><div id="msg"></div><p class="muted">Only use links from people you trust. This demo does not provide true end-to-end encryption.</p></section></main><script>const token='TOKEN_PLACEHOLDER';const info=document.querySelector('#info'),msg=document.querySelector('#msg');fetch('/api/share/'+token).then(r=>r.ok?r.json():r.json().then(x=>Promise.reject(x))).then(x=>info.textContent='Shared file: '+x.name+' · Expires: '+new Date(x.expires).toLocaleString()).catch(e=>info.textContent=e.detail||'Link unavailable');document.querySelector('#verify').addEventListener('submit',async e=>{e.preventDefault();const p=new FormData(e.target).get('passcode');msg.textContent='Checking…';const r=await fetch('/api/share/'+token+'/verify',{method:'POST',body:new URLSearchParams({passcode:p})});if(!r.ok){msg.textContent=(await r.json()).detail||'Verification failed';return;}const url='/api/share/'+token+'/download?passcode='+encodeURIComponent(p);const d=await fetch(url);if(!d.ok){msg.textContent=(await d.json()).detail||'Download failed';return;}const blob=await d.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shared-file';a.click();msg.textContent='Verified. Download started.';});</script></body></html>
